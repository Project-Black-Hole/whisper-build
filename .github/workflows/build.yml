# Builds whisper.cpp's server with patches/whisper-server.patch from the
# sources sources.pin.json names, on GitHub's own runner, and publishes it as
# a release when a tag is pushed. Nothing here is secret and nothing is
# downloaded that is not checked against a SHA-256 in sources.pin.json first.
name: Build

on:
  push:
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (win-x64, Vulkan)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Tools
        shell: bash
        run: |
          cmake --version
          python --version
          git --version
      - name: Build, check and package
        shell: bash
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
        run: python build.py build --variant vulkan --tag "$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: whisper-runtime-vulkan-x64
          path: dist/whisper-runtime-*-vulkan-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          ls -l
          test -f "whisper-runtime-$TAG-vulkan-x64.zip"
          sha256sum whisper-runtime-*.zip > SHA256SUMS
          cat SHA256SUMS
          cp ../sources.pin.json .
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "Built by this repository's workflow from the sources in sources.pin.json with patches/whisper-server.patch (commit $GITHUB_SHA)." \
            "whisper-runtime-$TAG-vulkan-x64.zip" SHA256SUMS sources.pin.json
